name: action-selftest
on:
  push:
    branches: [main]        # PR branches are covered by pull_request (avoids duplicate runs)
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR/branch supersedes older runs (saves scarce macOS runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: for f in action/*.sh action/selftest/*.sh; do bash -n "$f"; done
      - name: markdown escaping
        run: python3 action/md.py selftest

  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: good,        expect: verified }
          - { scenario: stale,       expect: rejected }
          - { scenario: half,        expect: rejected }
          - { scenario: delete-test, expect: rejected }
          - { scenario: no-marker,   expect: neutral }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build fixture repository
        run: bash action/selftest/fixture.sh "$RUNNER_TEMP/fx" "${{ matrix.scenario }}"
      - name: run the action (uses ./)
        id: gitent
        continue-on-error: true
        uses: ./
        with:
          version: source
          working-directory: ${{ runner.temp }}/fx
          base: main
          test-command: python3 -m unittest discover -q
          test-selector: python3 -m unittest discover -q -k {test}
          comment: "false"
      - name: assert outcome
        env:
          RESULT: ${{ steps.gitent.outputs.result }}
          OUTCOME: ${{ steps.gitent.outcome }}
          EXPECT: ${{ matrix.expect }}
        run: |
          echo "result=$RESULT outcome=$OUTCOME expected=$EXPECT"
          test "$RESULT" = "$EXPECT"
          case "$EXPECT" in
            verified|neutral) test "$OUTCOME" = "success" ;;
            *)                test "$OUTCOME" = "failure" ;;
          esac
          test -s "${{ steps.gitent.outputs.report }}"
          grep -q "gitent-verify-pr" "${{ steps.gitent.outputs.report }}"

  # Exercise the PR-comment path on this repository's own pull requests
  # (not backports, so the expected result is a single, updated "neutral" comment).
  pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Swatinem/rust-cache@v2
      - id: gitent
        uses: ./
        with:
          version: source
          test-command: "true"
      - name: assert neutral + one sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.gitent.outputs.result }}
        run: |
          test "$RESULT" = "neutral"
          n=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
                --jq '[.[] | select(.body | contains("<!-- gitent-verify-pr -->"))] | length')
          echo "sticky comments: $n"
          test "$n" = "1"
