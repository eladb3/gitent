name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: eval harness self-check (offline, no tokens)
        run: |
          cargo build --release
          python3 evals/run.py --agent offline --jobs 4
          python3 evals/run.py --agent stale --arms baseline,baseline+verify,gitent --jobs 4
