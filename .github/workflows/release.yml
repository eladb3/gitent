name: release
on:
  push:
    # Version tags only: the moving `v0` tag the Action is used by must not make a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          tar -C target/${{ matrix.target }}/release -czf gitent-${{ matrix.target }}.tar.gz gitent
          shasum -a 256 gitent-${{ matrix.target }}.tar.gz > gitent-${{ matrix.target }}.tar.gz.sha256
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md (`## 0.1.0` for tag v0.1.0).
          awk -v v="${TAG#v}" 'index($0, "## " v) == 1 && (length($0) == length(v) + 3 || substr($0, length(v) + 4, 1) == " ") {p = 1; next}
                               /^## / && p {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "gitent $TAG" --notes-file notes.md || true
          gh release upload "$TAG" gitent-${{ matrix.target }}.tar.gz gitent-${{ matrix.target }}.tar.gz.sha256 --clobber
