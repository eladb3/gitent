[package]
name = "gitent"
version = "0.1.0"
edition = "2021"
description = "Verify that backports, cherry-picks, merges and reverts actually carry the change: a safety and audit layer on top of Git"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/eladb3/gitent"
homepage = "https://github.com/eladb3/gitent"
readme = "README.md"
keywords = ["git", "backport", "cherry-pick", "ai-agents", "mcp"]
categories = ["development-tools", "command-line-utilities"]
# The crate is the CLI's source; demos, evals, docs and the Action stay on GitHub.
include = ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

# `cargo binstall gitent` downloads the release binary instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "gitent"
path = "src/main.rs"

[dependencies]
tempfile = "3"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tiny_http = "0.12"
toml = "0.8"
ureq = { version = "2.12", features = ["json", "native-certs"] }
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
