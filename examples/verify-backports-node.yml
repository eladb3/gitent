# Same, for a Node project. Only PRs that carry a backport marker are verified;
# everything else gets a neutral result.
name: verify backports
on:
  pull_request:
    branches: ["v*.x"]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: eladb3/gitent@v0
        with:
          test-command: "npm test --silent"
          test-selector: "npx jest -t {test}"
